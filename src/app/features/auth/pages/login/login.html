<div class="main-wrapper">
  <p-toast key="login" position="bottom-center" />

  <div class="login-page">
    <div class="login-box">
      <div class="container-titles">
        <img class="login-logo" src="/img/logoRosa.png" alt="Logo Agenda Rosa" />
        <h1 class="title">Bem <span class="title-gradient">Vindo!</span></h1>
        <h2 class="subtitle">Preencha os dados abaixo para começar.</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <p-floatlabel variant="on" class="float-field">
            <i class="pi pi-user p-inputicon field-icon" aria-hidden="true"></i>
            <input
              id="usuario"
              type="text"
              pInputText
              formControlName="usuario"
              class="rounded-input"
              autocomplete="username"
            />
            <label for="usuario">Usuário</label>
          </p-floatlabel>
        </div>

        <div class="field">
          <p-floatlabel variant="on" class="float-field">
            <i class="pi pi-unlock p-inputicon field-icon" aria-hidden="true"></i>
            <p-password
              inputId="senha"
              formControlName="senha"
              [feedback]="false"
              [toggleMask]="true"
              [autofocus]="false"
              inputStyleClass="rounded-input"
              styleClass="password-wrapper"
              autocomplete="current-password"
            ></p-password>
            <label for="senha">Senha</label>
          </p-floatlabel>
        </div>

        @if (recuperacaoDisponivel) {
          <div class="forgot-password">
            <button
              type="button"
              class="forgot-password-link"
              (click)="abrirRecuperacao()"
            >
              Esqueceu a senha?
            </button>
          </div>
        }

        <button
          pButton
          type="button"
          label="Continuar"
          class="login-button p-button-rounded"
          (click)="onSubmit()"
        ></button>
      </form>

      <div class="create-account">
        <p>
          Ainda não possui uma conta? <a class="create-account-link" href="/cadastro">Crie uma agora.</a>
        </p>
      </div>
    </div>
  </div>

  @if (recuperacaoDisponivel) {
    <app-esqueci-senha-modal
      [(visible)]="modalRecuperacaoVisivel"
    />
  }
</div>
